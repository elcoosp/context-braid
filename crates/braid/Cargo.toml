[package]
name = "braid"
version = "0.1.0"
edition = "2024"

[dependencies]
braid-core = { path = "../braid-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gix = { version = "0.70", default-features = false, features = ["status", "dirwalk"] }
rusqlite = { version = "0.34", features = ["bundled"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSDictionary", "NSRunLoop", "NSDate"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationSettings", "UNNotificationResponse", "UNNotificationAction", "UNNotificationCategory", "block2"] }
block2 = "0.6"
