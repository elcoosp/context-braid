[package]
name = "braid"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
braid-core = { path = "../braid-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gix = { version = "0.91", default-features = false, features = ["sha1", "status", "dirwalk"] }
rusqlite = { version = "0.43", features = ["bundled"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSDictionary", "NSRunLoop", "NSDate"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationSettings", "UNNotificationResponse", "UNNotificationAction", "UNNotificationCategory", "block2"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString"] }

[lints]
workspace = true
